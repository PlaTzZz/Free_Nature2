<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Galería de Arte - Galería</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header class="barra-principal">
        <nav class="navbar navbar-expand-lg navbar-dark container">
            <a class="navbar-brand logo-marca" href="inicio.html">Free Nature</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
                    aria-expanded="false" aria-label="Mostrar menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link enlace-menu" href="inicio.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link enlace-menu active" href="galeria.html">Galería</a></li>
                    <li class="nav-item"><a class="nav-link enlace-menu" href="contacto.html">Contacto</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container py-5">
        <div class="text-center mb-5">
            <h1 class="titulo-hero">Galería de Arte En Línea</h1>
            <h2 class="subtitulo-hero">Nuestra colección de obras de nuestra hermosa fauna</h2>
            <p class="lead texto-intro">Mira con mucho detalle esta galería que tenemos para ti. Haz clic en una obra para verla en grande:</p>
        </div>

        <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4">

            <div class="col">
                <div class="card tarjeta-obra h-100">
                    <img src="img/pudu.jpg" class="card-img-top imagen-galeria" alt="Pudú"
                         data-bs-toggle="modal" data-bs-target="#modalImagen"
                         data-titulo="Pudú"
                         data-texto="El pudú es el ciervo más pequeño del mundo y habita los bosques del sur de Chile.">
                </div>
            </div>

            <div class="col">
                <div class="card tarjeta-obra h-100">
                    <img src="img/martin.jpg" class="card-img-top imagen-galeria" alt="Martín pescador"
                         data-bs-toggle="modal" data-bs-target="#modalImagen"
                         data-titulo="Martín pescador"
                         data-texto="Ave de colores brillantes que vive cerca de ríos y lagos, famosa por su rápida técnica de pesca.">
                </div>
            </div>

            <div class="col">
                <div class="card tarjeta-obra h-100">
                    <img src="img/volcan.jpg" class="card-img-top imagen-galeria" alt="Volcán"
                         data-bs-toggle="modal" data-bs-target="#modalImagen"
                         data-titulo="Volcán"
                         data-texto="Paisaje imponente de la cordillera, donde la naturaleza muestra toda su fuerza y belleza.">
                </div>
            </div>

            <div class="col">
                <div class="card tarjeta-obra h-100">
                    <img src="img/bosque.jpg" class="card-img-top imagen-galeria" alt="Bosque"
                         data-bs-toggle="modal" data-bs-target="#modalImagen"
                         data-titulo="Bosque"
                         data-texto="Un bosque nativo lleno de vida, hogar de cientos de especies de flora y fauna.">
                </div>
            </div>

            <div class="col">
                <div class="card tarjeta-obra h-100">
                    <img src="img/puma.jpg" class="card-img-top imagen-galeria" alt="Puma"
                         data-bs-toggle="modal" data-bs-target="#modalImagen"
                         data-titulo="Puma"
                         data-texto="El puma es un felino ágil y solitario, símbolo de fuerza y libertad en la naturaleza.">
                </div>
            </div>

            <div class="col">
                <div class="card tarjeta-obra h-100">
                    <img src="img/zorro.jpg" class="card-img-top imagen-galeria" alt="Zorro"
                         data-bs-toggle="modal" data-bs-target="#modalImagen"
                         data-titulo="Zorro"
                         data-texto="Astuto y curioso, el zorro chilote es una especie unica y endemica de la isla grande de chiloe .">
                </div>
            </div>

        </div>
    </main>

    <!-- Ventana (modal) para ver la imagen en grande -->
    <div class="modal fade" id="modalImagen" tabindex="-1" aria-labelledby="modalTitulo" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content modal-obra">
                <div class="modal-header border-0">
                    <h5 class="modal-title titulo-modal" id="modalTitulo"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body text-center pt-0">
                    <img src="" alt="" id="modalFoto" class="img-fluid rounded imagen-modal">
                    <p id="modalTexto" class="texto-modal mt-3 mb-0"></p>
                </div>
            </div>
        </div>
    </div>

    <footer class="pie-pagina text-center py-3">
        <small>© 2026 Free Nature · Todos los derechos reservados</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Cuando se abre el modal, se llena con los datos de la imagen clickeada
        const modal = document.getElementById('modalImagen');
        modal.addEventListener('show.bs.modal', function (evento) {
            const imagen = evento.relatedTarget;
            document.getElementById('modalFoto').src = imagen.src;
            document.getElementById('modalFoto').alt = imagen.alt;
            document.getElementById('modalTitulo').textContent = imagen.dataset.titulo;
            document.getElementById('modalTexto').textContent = imagen.dataset.texto;
        });
    </script>
</body>
</html>
